<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .layout {
    display: grid;
    grid-template-columns: 1fr 3fr;

    grid-template-areas:
        "header header"
        "sidebar content"
        "footer footer";

    gap: 10px;
}

header {
    grid-area: header;
    background-color: lightblue;
}

aside {
    grid-area: sidebar;
    background-color: lightgreen;
}

main {
    grid-area: content;
    background-color: rgb(229, 229, 145);
}

footer {
    grid-area: footer;
    background-color: lightpink;
}
  </style>
</head>
<body>
  <div class="layout">
    <header>Header</header>
    <aside>Sidebar</aside>
    <main>Content</main>
    <footer>Footer</footer>
</div>
</body>
</html>
